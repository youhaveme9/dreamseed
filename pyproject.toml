[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamseed-mcp"
version = "0.2.0"
description = "Local MCP server for deterministic Minecraft seed search"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "DreamSeed contributors"}]
keywords = ["minecraft", "cubiomes", "mcp", "seed search"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "mcp==2.2.0",
  "pydantic==2.12.5"
]

[project.urls]
Homepage = "https://github.com/youhaveme9/dreamseed"
Repository = "https://github.com/youhaveme9/dreamseed"
Documentation = "https://github.com/youhaveme9/dreamseed#readme"
Issues = "https://github.com/youhaveme9/dreamseed/issues"
Changelog = "https://github.com/youhaveme9/dreamseed/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build==1.3.0"]
http = ["uvicorn==0.54.0", "PyJWT[crypto]==2.15.1", "cryptography==50.0.2"]

[project.scripts]
dreamseed-terrain = "dreamseed_mcp.terrain_cli:main"
dreamseed-web = "dreamseed_mcp.web_server:main"
dreamseed-http = "dreamseed_mcp.http_server:main"
dreamseed-mcp = "dreamseed_mcp.server:main"
dreamseed-doctor = "dreamseed_mcp.doctor:main"
dreamseed-minecraft-setup = "dreamseed_mcp.minecraft_setup:main"

[tool.setuptools.packages.find]
include = ["dreamseed_mcp*"]

[tool.setuptools.package-data]
dreamseed_mcp = ["minecraft_versions.json", "web/*.html", "web/*.css", "web/*.js"]
